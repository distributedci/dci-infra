---
- name: Fail if no listener is enabled
  ansible.builtin.assert:
    that: (rabbitmq_cleartext_enabled | bool) or (rabbitmq_tls_enabled | bool)
    fail_msg: >-
      At least one of "rabbitmq_cleartext_enabled" or "rabbitmq_tls_enabled"
      must be true, otherwise the broker is unreachable.
    success_msg: At least one AMQP listener is enabled

- name: Fail if no client user is defined
  ansible.builtin.assert:
    that: rabbitmq_users | length > 0
    fail_msg: >-
      "rabbitmq_users" is empty. Define at least one user, otherwise no client
      can connect (the default guest user is not created).
    success_msg: rabbitmq_users is defined

- name: Fail if a user is missing a name or a password, or still uses the placeholder
  ansible.builtin.assert:
    that:
      - item.name is defined
      - item.name | length > 0
      - item.password is defined
      - item.password | length > 0
      - item.password != "CHANGEME"
    fail_msg: >-
      Every entry of "rabbitmq_users" needs a non-empty "name" and "password",
      and the password must be overriden from the "CHANGEME" placeholder.
    success_msg: User entry is valid
  loop: "{{ rabbitmq_users }}"
  loop_control:
    label: "{{ item.name | default('<unnamed>') }}"
  no_log: true

- name: Verify the certificate data is available
  when: rabbitmq_tls_enabled | bool
  ansible.builtin.assert:
    that:
      - dci_ca is defined
      - dci_ca.ca_cert is defined
      - dci_ca.servercerts[rabbitmq_ca_servercert_name] is defined
      - dci_ca.servercerts[rabbitmq_ca_servercert_name].cert is defined
      - dci_ca.servercerts[rabbitmq_ca_servercert_name].key is defined
    fail_msg: >-
      TLS is enabled but dci_ca.servercerts.{{ rabbitmq_ca_servercert_name }}
      is missing. Add a "{{ rabbitmq_ca_servercert_name }}" entry to
      dci_certificate_authority_servercerts and re-run dci_ca.yml.
    success_msg: "Certificate data for {{ rabbitmq_ca_servercert_name }} is available"
...
